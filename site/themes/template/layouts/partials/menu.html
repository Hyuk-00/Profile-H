<ul class="menu-list">
  {{ range site.Menus.main }}
    <li class="menu-item">
      <a
        href="{{ .URL | relLangURL }}"
        class="menu-link {{ if $.IsMenuCurrent "main" . }}active{{ end }}">
        {{ .Name }}
      </a>
    {{ if .HasChildren }}
        <ul class="menu-sublist">
          {{ range .Children }}
            <li class="menu-item">
              <a
                href="{{ .URL | relLangURL }}"
                class="menu-link menu-sublink {{ if $.IsMenuCurrent "main" . }}active{{ end }}">
                {{ .Name }}
              </a>
            </li>
          {{ end }}
        </ul>
      {{ end }}
    </li>
  {{ end }}
</ul>
